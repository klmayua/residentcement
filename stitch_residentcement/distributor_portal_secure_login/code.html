<style>.material-symbols-outlined {

<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary-fixed">
<main class="min-h-screen flex items-center justify-center p-6 bg-login-hero" data-alt="Architectural low-angle shot of brutalist concrete building with warm sunset glow">
<!-- Login Card Shell -->
<div class="w-full max-w-[480px] bg-surface-container shadow-2xl overflow-hidden relative border border-outline-variant/10">
<!-- Branding Header -->
<div class="pt-16 pb-12 px-12 flex flex-col items-center">
<img alt="ResidentCement Logo" class="h-20 w-auto mb-8" data-alt="ResidentCement elegant minimalist industrial logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDzhuBrtUh0PQAhmSaGVWZilTF7bKXBTlsSPTeisuuIv8qQB0n4UKmZYhFyHFc5MYbbab0F-xM7kXwNfCTJacIZ2gYCPs0QYbArrVOpVAmWH7Fj7SykSMDUzJgtPwRPt8LzbIxcj6PahwZl2LSEuz5u7VESGG1AW8y7btSjBIO_gNtqG0A1PLFqXbxCLSj-FRh7EBaW9GZZWRxym-ezZKoGxPHeTZRKjv-MeSJzx3DCUubes36QQBXjx-w_TjpTKpsOhlonF52PU_KO"/>
<h1 class="font-headline text-3xl font-bold tracking-tight text-on-surface uppercase mb-2">Distributor Portal</h1>
<p class="font-label text-xs uppercase tracking-[0.3em] text-on-surface-variant">Industrial Strength. Architectural Elegance.</p>
</div>
<!-- Login Form -->
<form class="px-12 pb-16 space-y-10">
<!-- Input Group: Email -->
<div class="relative flex flex-col group">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-2 transition-colors group-focus-within:text-primary" for="email">Corporate Email</label>
<div class="ghost-border flex items-center pb-2 transition-all">
<span class="material-symbols-outlined text-outline mr-3 text-lg">mail</span>
<input class="bg-transparent border-none p-0 w-full text-on-surface placeholder:text-outline/40 focus:ring-0 text-sm font-body" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="relative flex flex-col group">
<div class="flex justify-between items-end mb-2">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant transition-colors group-focus-within:text-primary" for="password">Access Key</label>
<a class="font-label text-[10px] uppercase tracking-widest text-secondary-fixed-dim hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<div class="ghost-border flex items-center pb-2 transition-all">
<span class="material-symbols-outlined text-outline mr-3 text-lg">lock</span>
<input class="bg-transparent border-none p-0 w-full text-on-surface placeholder:text-outline/40 focus:ring-0 text-sm font-body" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me & Actions -->
<div class="flex items-center justify-between pt-2">
<label class="flex items-center cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-4 w-4 rounded-sm border-outline-variant bg-surface-container-highest text-primary focus:ring-offset-surface focus:ring-primary" type="checkbox"/>
</div>
<span class="ml-3 font-label text-[10px] uppercase tracking-wider text-on-surface-variant group-hover:text-on-surface transition-colors">Keep me signed in</span>
</label>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full py-4 bg-gradient-to-r from-primary to-on-primary-container text-on-primary-fixed font-label text-xs font-bold uppercase tracking-[0.2em] rounded-sm shadow-lg hover:opacity-90 active:scale-[0.98] transition-all duration-300" type="submit">
                        Sign In to Portal
                    </button>
</div>
<!-- Secondary Action -->
<div class="pt-6 text-center">
<p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-4">New Distribution Partner?</p>
<button class="inline-block px-8 py-3 border border-outline-variant/30 hover:bg-surface-container-highest hover:border-outline-variant transition-all duration-300 text-secondary-fixed-dim font-label text-[10px] uppercase tracking-widest" type="button">
                        Request Access
                    </button>
</div>
</form>
<!-- Decorative Element -->
<div class="absolute bottom-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
</div>
</main>
<!-- Footer for Shell (Hidden on Mobile) -->
<footer class="fixed bottom-0 left-0 w-full flex justify-between items-center px-12 py-8 bg-transparent pointer-events-none">
<div class="pointer-events-auto">
<p class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface/40">© 2024 ResidentCement Industrial. All Rights Reserved.</p>
</div>
<div class="flex gap-x-8 pointer-events-auto">
<a class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface/40 hover:text-primary transition-colors underline-offset-4 hover:underline" href="#">Privacy Policy</a>
<a class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface/40 hover:text-primary transition-colors underline-offset-4 hover:underline" href="#">Support</a>
</div>
</footer>
</body></html>
