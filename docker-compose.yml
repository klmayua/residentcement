version: '3.9'

# ResidentCement - Board Ready MVP
# Audit Session: forensics1032026
# Security Hardened Configuration

services:
  # ============================================================================
  # RESIDENTCEMENT APPLICATION (MVP)
  # ============================================================================
  residentcement:
    image: residentcement:board-ready
    container_name: residentcement
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3001"
    environment:
      - NODE_ENV=production
      - ENV=board-demo
      - DEMO_MODE=true
      # Database connections (use existing infrastructure)
      - DATABASE_URL=postgresql://resident_cement:${DB_PASSWORD:-REDACTED_MVP}@postgres:5432/resident_cement
      - MONGODB_URI=mongodb://resident_cement:${MONGO_PASSWORD:-REDACTED_MVP}@mongodb:27017/resident_cement
      - REDIS_URL=redis://redis:6379
      # Security (redacted for board demo)
      - JWT_SECRET=${JWT_SECRET:-REDACTED_MVP}
      - API_KEY=${API_KEY:-REDACTED_MVP}
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================
  
  # PostgreSQL (Primary Database)
  postgres:
    image: postgres:16-alpine
    container_name: resident-cement-postgres
    environment:
      POSTGRES_USER: resident_cement
      POSTGRES_PASSWORD: ${DB_PASSWORD:-REDACTED_MVP}
      POSTGRES_DB: resident_cement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resident_cement"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB (Document Store)
  mongodb:
    image: mongo:7.0
    container_name: resident-cement-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: resident_cement
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-REDACTED_MVP}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - resident-cement-network
    restart: unless-stopped

  # Redis (Cache & Session Store)
  redis:
    image: redis:7-alpine
    container_name: resident-cement-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - resident-cement-network
    restart: unless-stopped

  # Kafka & Zookeeper (Event Bus)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: resident-cement-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - resident-cement-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: resident-cement-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - resident-cement-network
    restart: unless-stopped

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: resident-cement-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: resident-cement
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - resident-cement-network
    restart: unless-stopped

  # Keycloak (Identity Provider)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: resident-cement-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password_2026
      KC_DB: dev-file
    ports:
      - "8180:8080"
    networks:
      - resident-cement-network
    restart: unless-stopped

  # MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: resident-cement-minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_2026
    ports:
      - "9000:9000"
      - "9002:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - resident-cement-network
    restart: unless-stopped

networks:
  resident-cement-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:
  minio_data:
