# PHASE 0 — BUG FIXES (must complete before deployment)
# =============================================================================

fixes:

  - id: FIX-01
    title: Missing inventoryApi import in dashboard
    severity: BLOCKER
    file: frontend/apps/distributor-portal/src/app/page.tsx
    problem: |
      Line 38 calls `inventoryApi.getLowStock()` but inventoryApi is not in the
      import statement on line 4. Build will fail.
    fix: |
      Add `inventoryApi` to the import on line 4:
        import { customersApi, ordersApi, productsApi, paymentsApi, inventoryApi } from '@/lib/api';
    verify: Build succeeds with `npm run build` in frontend/apps/distributor-portal

  - id: FIX-02
    title: Customer service Dockerfile addgroup syntax error
    severity: BLOCKER
    file: backend/services/customer-service/Dockerfile
    problem: |
      Line 24: `addgroup -system -gid 1001 nodejs` — Alpine uses double-dash flags.
      Should be `--system` and `--gid`. Same for adduser on same line.
    fix: |
      Replace line 24-25 with:
        RUN addgroup --system --gid 1001 nodejs && \
            adduser --system --uid 1001 nodejs
    verify: docker build succeeds for customer-service
    note: Check ALL service Dockerfiles for the same error (order, product, inventory, payment, pricing)

  - id: FIX-03
    title: Frontend Dockerfile assumes wrong build context
    severity: HIGH
    file: frontend/apps/distributor-portal/Dockerfile
    problem: |
      The Dockerfile runs `npm run build` at /app root but copies individual
      package.json. When docker-compose builds with context=project_root, the
      `npm ci` at root level may not install frontend deps correctly. Also,
      lines 23-25 copy from /app/public and /app/.next but build output is
      actually in frontend/apps/distributor-portal/.next.
    fix: |
      Rewrite Dockerfile for correct monorepo build:

      FROM node:20-alpine AS base
      RUN apk add --no-cache libc6-compat

      FROM base AS deps
      WORKDIR /app/frontend/apps/distributor-portal
      COPY frontend/apps/distributor-portal/package*.json ./
      RUN npm ci

      FROM base AS builder
      WORKDIR /app/frontend/apps/distributor-portal
      COPY --from=deps /app/frontend/apps/distributor-portal/node_modules ./node_modules
      COPY frontend/apps/distributor-portal/ ./
      ENV NEXT_TELEMETRY_DISABLED=1
      RUN npm run build

      FROM base AS runner
      WORKDIR /app
      ENV NODE_ENV=production
      ENV NEXT_TELEMETRY_DISABLED=1
      RUN addgroup --system --gid 1001 nodejs && \
          adduser --system --uid 1001 nextjs
      COPY --from=builder /app/frontend/apps/distributor-portal/public ./public
      COPY --from=builder --chown=nextjs:nodejs /app/frontend/apps/distributor-portal/.next/standalone ./
      COPY --from=builder --chown=nextjs:nodejs /app/frontend/apps/distributor-portal/.next/static ./.next/static
      USER nextjs
      EXPOSE 3000
      ENV PORT=3000
      ENV HOSTNAME="0.0.0.0"
      CMD ["node", "server.js"]

    verify: |
      1. next.config must have `output: "standalone"` for standalone mode
      2. docker build succeeds
      3. Container serves pages on :3000

  - id: FIX-04
    title: Ensure next.config has standalone output
    severity: HIGH
    file: frontend/apps/distributor-portal/next.config.ts
    problem: |
      The frontend Dockerfile copies .next/standalone, but Next.js only
      generates this when output is set to "standalone" in next.config.
    fix: |
      In next.config.ts (or .js), ensure:
        const nextConfig = {
          output: "standalone",
          // ... other config
        };
    verify: npm run build produces .next/standalone/

  - id: FIX-05
    title: ".env" with real secrets committed to git
    severity: CRITICAL-SECURITY
    file: .env
    problem: |
      Root .env contains real DB passwords, JWT secrets, API keys and is
      tracked by git. Anyone with repo access has full credentials.
    fix: |
      1. Add .env to .gitignore (verify it's not already excluded by a
         pattern that's being overridden)
      2. Run: git rm --cached .env
      3. Also check: backend/services/*/  for any tracked .env or .env.bak
      4. Rotate ALL secrets in .env after removal (they are now compromised)
      5. Leave .env.example as-is (safe template)
    verify: |
      git ls-files | grep '\.env' should return ONLY .env.example files
    note: Do NOT delete .env — just untrack it. The file is needed for local dev.

