  - id: DOCKER-02
    title: Create Nginx reverse proxy config
    file: infrastructure/docker/nginx/conf.d/default.conf (NEW)
    fix: |
      Create Nginx config that:
      - Routes / to frontend:3000 (Next.js app)
      - Routes /api/ to gateway:3001 (API Gateway)
      - Routes /api-docs to gateway:3001 (Swagger)
      - Routes /health to gateway:3001
      - Serves static assets with cache headers
      - Sets proxy headers (X-Real-IP, X-Forwarded-For, Host)
      - WebSocket upgrade support for real-time features

      server {
          listen 80;
          server_name _;

          # API Gateway
          location /api/ {
              proxy_pass http://gateway:3001;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /api-docs {
              proxy_pass http://gateway:3001;
              proxy_set_header Host $host;
          }

          location /health {
              proxy_pass http://gateway:3001;
          }

          # WebSocket support
          location /ws {
              proxy_pass http://gateway:3001;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
          }

          # Frontend (Next.js)
          location / {
              proxy_pass http://frontend:3000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
          }
      }

