docker:

  - id: DOCKER-01
    title: Create production docker-compose.prod.yml
    file: docker-compose.prod.yml (NEW)
    problem: |
      The existing docker-compose.yml only runs the gateway + infrastructure.
      Missing: frontend, all 6 microservices, Nginx reverse proxy,
      Prisma migration init step.
    fix: |
      Create docker-compose.prod.yml with ALL services. Structure:

      services:
        # --- REVERSE PROXY ---
        nginx:
          image: nginx:1.25-alpine
          container_name: rc-nginx
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./infrastructure/docker/nginx/conf.d:/etc/nginx/conf.d:ro
          depends_on:
            - frontend
            - gateway
          networks:
            - resident-cement-network
          restart: unless-stopped

        # --- FRONTEND ---
        frontend:
          build:
            context: .
            dockerfile: frontend/apps/distributor-portal/Dockerfile
          container_name: rc-frontend
          environment:
            NEXT_PUBLIC_API_URL: http://gateway:3001
          depends_on:
            gateway:
              condition: service_healthy
          networks:
            - resident-cement-network
          restart: unless-stopped

        # --- API GATEWAY ---
        gateway:
          build:
            context: .
            dockerfile: Dockerfile
          container_name: rc-gateway
          environment:
            NODE_ENV: production
            PORT: "3001"
            DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
            MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
            REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
            KAFKA_BROKERS: kafka:29092
            JWT_SECRET: ${JWT_SECRET}
            CORS_ORIGIN: http://localhost,http://frontend:3000
          depends_on:
            postgres:
              condition: service_healthy
            redis:
              condition: service_healthy
            kafka:
              condition: service_healthy
            db-migrate:
              condition: service_completed_successfully
          networks:
            - resident-cement-network
          restart: unless-stopped
          healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

        # --- DATABASE MIGRATION (init container) ---
        db-migrate:
          build:
            context: .
            dockerfile: Dockerfile
          container_name: rc-db-migrate
          command: >
            sh -c "npx prisma migrate deploy && npx prisma db seed || true"
          environment:
            DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
          depends_on:
            postgres:
              condition: service_healthy
          networks:
            - resident-cement-network
          restart: "no"

        # --- MICROSERVICES ---
        # (customer-service, order-service, product-service,
        #  inventory-service, payment-service, pricing-service)
        # Each builds from its own Dockerfile, connects to same DB + Kafka.
        # Port mapping: only internal Docker network, not exposed to host.
        customer-service:
          build:
            context: backend/services/customer-service
          container_name: rc-customer-svc
          environment:
            NODE_ENV: production
            PORT: "3002"
            DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
            KAFKA_BROKERS: kafka:29092
            REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
          depends_on:
            db-migrate:
              condition: service_completed_successfully
          networks:
            - resident-cement-network
          restart: unless-stopped

        order-service:
          build:
            context: backend/services/order-service
          container_name: rc-order-svc
          environment:
            NODE_ENV: production
            PORT: "3007"
            DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
            KAFKA_BROKERS: kafka:29092
            REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
          depends_on:
            db-migrate:
              condition: service_completed_successfully
          networks:
            - resident-cement-network
          restart: unless-stopped

        product-service:
          build:
            context: backend/services/product-service
          container_name: rc-product-svc
          environment:
            NODE_ENV: production
            PORT: "3006"
            DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
            KAFKA_BROKERS: kafka:29092
          depends_on:
