# =============================================================================
# PHASE 3 — ENHANCEMENTS
# =============================================================================

enhancements:

  - id: ENH-01
    title: Real-time order status via WebSocket
    priority: P1
    problem: |
      Dashboard shows order data via polling (React Query refetch). For a
      cement distribution platform, real-time order tracking is critical —
      distributors need instant updates when orders move through
      PENDING -> CONFIRMED -> PROCESSING -> DISPATCHED -> DELIVERED.
    files:
      - backend/gateway/src/index.ts
      - frontend/apps/distributor-portal/src/app/page.tsx
      - frontend/apps/distributor-portal/src/lib/websocket.ts (NEW)
    fix: |
      1. Add WebSocket support to the gateway using `ws` package:
         - Install: npm i ws @types/ws
         - In index.ts, after creating the HTTP server:
           const wss = new WebSocketServer({ server, path: '/ws' });
         - On Kafka consumer events (ORDER_STATUS_CHANGED, INVENTORY_LOW),
           broadcast to connected WebSocket clients
         - Authenticate WS connections via JWT in query param

      2. Create frontend/src/lib/websocket.ts:
         - Connect to ws://gateway/ws?token=JWT
         - Export useOrderUpdates() hook that listens for order events
         - Export useLowStockAlerts() hook for inventory alerts
         - Auto-reconnect on disconnect

      3. Update dashboard page.tsx:
         - Use useOrderUpdates() to show live order status changes
         - Use useLowStockAlerts() for real-time low stock notifications
         - Show a live indicator dot in the header when WS is connected
    acceptance: |
      When an order status changes via API, the dashboard updates within 1s
      without manual page refresh.

  - id: ENH-02
    title: Kafka consumer in gateway for event-driven updates
    priority: P1
    problem: |
      Gateway has Kafka producer (publishes events) but no consumer.
      Microservices publish events (CUSTOMER_CREATED, ORDER_UPDATED, etc.)
      but nothing aggregates them for the frontend.
    files:
      - backend/gateway/src/lib/kafka.ts
      - backend/gateway/src/index.ts
    fix: |
      1. In kafka.ts, add a consumer that subscribes to topics:
         - resident-cement.orders (order lifecycle events)
         - resident-cement.inventory (stock changes, low stock alerts)
         - resident-cement.payments (payment confirmations)
      2. On consuming an event, broadcast via WebSocket (from ENH-01)
      3. Optionally cache latest state in Redis for fast dashboard loads
    acceptance: |
      Kafka consumer connects on startup, processes events, and forwards
      to WebSocket clients.

  - id: ENH-03
    title: Add health checks for all microservices in docker-compose
    priority: P1
    problem: |
      Only gateway and infrastructure services have health checks in
      docker-compose. Microservices don't, so Docker can't determine
      if they're truly ready.
    fix: |
      Add to each microservice in docker-compose.prod.yml:
        healthcheck:
          test: ["CMD", "curl", "-sf", "http://localhost:${PORT}/health"]
          interval: 30s
          timeout: 5s
          retries: 3
          start_period: 20s
      Also add `curl` to each service Dockerfile:
        RUN apk add --no-cache curl
    acceptance: |
      `docker compose ps` shows all services as "healthy"

  - id: ENH-04
    title: Logo asset placement (DONE) + additional logo usage
    priority: P2
    status: LOGO ALREADY COPIED
    files:
      - docs/imanges/resident_cementlogo.png               # source (21KB)
      - frontend/apps/distributor-portal/public/images/logo.png  # destination (ALREADY IN PLACE)
    fix: |
      Logo is already copied to public/images/logo.png. Remaining work:
      1. Reference in all page headers, login, register screens (see BRAND-04)
      2. Add to Swagger/API docs page title if applicable
      3. Add as Open Graph image in layout.tsx metadata:
           openGraph: {
             title: 'Resident Cement Limited',
             description: 'Enterprise cement distribution platform',
             images: [{ url: '/images/logo.png', width: 400, height: 200 }],
           }
      4. If a favicon.ico is needed, generate one from the logo PNG using
         any PNG-to-ICO tool (32x32 crop of the camel portion).
    note: The source folder is misspelled "imanges" — do NOT rename it.

  - id: ENH-05
    title: Add Prisma migration to gateway Dockerfile
    priority: P1
    file: Dockerfile
    problem: |
      The Dockerfile builds the gateway but doesn't include Prisma migration
      files needed by the db-migrate init container.
    fix: |
      Ensure the Prisma migrations directory is copied in the runtime stage:
        COPY --from=gateway-build --chown=nodejs:nodejs /build/backend/gateway/prisma ./prisma
      This is already done (line 60), but verify that `prisma/migrations/`
      is included and not excluded by .dockerignore.
    verify: |
      Check .dockerignore does NOT exclude prisma/migrations

  - id: ENH-06
    title: Frontend API URL for Docker networking
    priority: P1
    file: frontend/apps/distributor-portal/src/lib/api.ts
    problem: |
      API_URL defaults to http://localhost:3001 which won't work inside Docker.
      In Docker, the browser still makes requests from the user's machine, so
      the URL needs to be the Nginx-proxied /api path, not a direct container URL.
    fix: |
      Change the API base URL logic:
        const API_URL = process.env.NEXT_PUBLIC_API_URL || '/api/v1';
      And update the api.create baseURL accordingly:
        const api = axios.create({
          baseURL: process.env.NEXT_PUBLIC_API_URL || '',
        });
      This way, in production behind Nginx, requests go to /api/v1/*
      which Nginx proxies to the gateway. In development, set
      NEXT_PUBLIC_API_URL=http://localhost:3001 in .env.local.
    acceptance: |
      Frontend makes API calls to relative /api/v1/* paths in production,
      which Nginx correctly proxies to the gateway.

