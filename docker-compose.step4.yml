# Step 4: Zookeeper only
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: residentcement-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    networks:
      - resident-cement-network
    restart: unless-stopped

networks:
  resident-cement-network:
    driver: bridge
