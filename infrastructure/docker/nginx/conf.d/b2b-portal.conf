# B2B Portal Nginx Configuration
# Place this file in infrastructure/docker/nginx/conf.d/

upstream b2b-portal {
    server b2b-portal:3002;
}

server {
    listen 80;
    server_name rcb2bportal.nyamabo.com;

    # Redirect to HTTPS in production
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://b2b-portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://b2b-portal/api/health;
        access_log off;
    }

    # Static files caching
    location /_next/static {
        proxy_pass http://b2b-portal/_next/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static {
        proxy_pass http://b2b-portal/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

