map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream rc_gateway {
    server gateway:3001;
}

upstream rc_corporate {
    server corporate-website:80;
}

upstream rc_dealer {
    server dealer-portal:3000;
}

upstream rc_b2b {
    server b2b-portal:3002;
}

upstream rc_erp {
    server admin-dashboard:3001;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 http://residentcement.nyamabo.com$request_uri;
}

server {
    listen 80;
    server_name residentcement.nyamabo.com;

    location /api/ {
        proxy_pass http://rc_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        proxy_pass http://rc_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://rc_gateway/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://rc_corporate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

