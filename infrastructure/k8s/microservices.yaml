---
# Microservices Deployment Template
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: resident-cement
  labels:
    app: customer-service
    component: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
        component: microservice
    spec:
      containers:
        - name: customer-service
          image: residentcement/customer-service:latest
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: resident-cement-secrets
                  key: database-url
            - name: KAFKA_BROKERS
              value: "kafka:9092"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Customer Service Service
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: resident-cement
  labels:
    app: customer-service
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
  selector:
    app: customer-service
