# =============================================================================
# ResidentCement Microservices - Kubernetes Deployment
# =============================================================================

# -----------------------------------------------------------------------------
# Customer Service
# -----------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: resident-cement
  labels:
    app: customer-service
    component: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
    spec:
      containers:
        - name: customer-service
          image: ghcr.io/resident-cement/customer-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3002"
            - name: SERVICE_NAME
              value: "customer-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: postgres-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-url
            - name: KAFKA_BROKERS
              value: "kafka-headless:9092"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10

---
# Customer Service Service
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: resident-cement
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3002
  selector:
    app: customer-service

---
