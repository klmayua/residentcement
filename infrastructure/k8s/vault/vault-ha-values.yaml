# Vault High Availability Configuration
# Use this for production deployments

global:
  enabled: true
  tlsDisable: false

server:
  # HA mode with Raft storage
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 0
          tls_cert_file = "/vault/userconfig/vault-server-tls/tls.crt"
          tls_key_file = "/vault/userconfig/vault-server-tls/tls.key"
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  # Data persistence
  dataStorage:
    enabled: true
    size: 10Gi
    mountPath: /vault/data
  auditStorage:
    enabled: true
    size: 10Gi

  # Service account
  serviceAccount:
    create: true
    annotations: {}

  # Ingress
  ingress:
    enabled: true
    hosts:
      - host: vault.residentcement.com
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      - secretName: vault-tls
        hosts:
          - vault.residentcement.com

# UI
ui:
  enabled: true
  serviceType: ClusterIP

# Injector for sidecar injection
injector:
  enabled: true
  replicas: 2
  metrics:
    enabled: true
