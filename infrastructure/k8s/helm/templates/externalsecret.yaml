{{/*
ResidentCement External Secrets Configuration
Integrates with HashiCorp Vault via External Secrets Operator
*/}}
{{- if .Values.vault.enabled }}
---
# ExternalSecret for Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "resident-cement.fullname" . }}-db-credentials
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.vault.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.vault.secretStoreName | default "vault-backend" }}
  target:
    name: {{ include "resident-cement.fullname" . }}-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        db-password: "{{ `{{ .postgres_password }}` }}"
        mongo-password: "{{ `{{ .mongodb_password }}` }}"
        redis-password: "{{ `{{ .redis_password }}` }}"
  data:
    - secretKey: postgres_password
      remoteRef:
        key: secret/data/resident-cement/database/postgres
        property: password
    - secretKey: mongodb_password
      remoteRef:
        key: secret/data/resident-cement/database/mongodb
        property: password
    - secretKey: redis_password
      remoteRef:
        key: secret/data/resident-cement/database/redis
        property: password
---
# ExternalSecret for Application Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "resident-cement.fullname" . }}-app-secrets
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.vault.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.vault.secretStoreName | default "vault-backend" }}
  target:
    name: {{ include "resident-cement.fullname" . }}-app-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        jwt-secret: "{{ `{{ .jwt_secret }}` }}"
        api-key: "{{ `{{ .api_key }}` }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: secret/data/resident-cement/application
        property: jwt-secret
    - secretKey: api_key
      remoteRef:
        key: secret/data/resident-cement/application
        property: api-key
---
# ExternalSecret for Payment Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "resident-cement.fullname" . }}-payment-secrets
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.vault.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.vault.secretStoreName | default "vault-backend" }}
  target:
    name: {{ include "resident-cement.fullname" . }}-payment-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        paystack-secret-key: "{{ `{{ .paystack_secret_key }}` }}"
  data:
    - secretKey: paystack_secret_key
      remoteRef:
        key: secret/data/resident-cement/payment
        property: paystack-secret-key
{{- end }}
