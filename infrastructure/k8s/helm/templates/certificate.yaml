{{/*
ResidentCement Certificate Resources for cert-manager
Creates TLS certificates for all ingress endpoints
*/}}
{{- if .Values.certManager.enabled }}
---
# API Gateway Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "resident-cement.gateway.fullname" . }}-tls
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.gateway.ingress.tls.secretName | default (printf "%s-gateway-tls" (include "resident-cement.fullname" .)) }}
  issuerRef:
    name: {{ .Values.certManager.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.gateway.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  # Certificate validity duration
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days
  # Private key configuration
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  # Usages
  usages:
    - server auth
    - client auth
---
# Frontend Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "resident-cement.frontend.fullname" . }}-tls
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.frontend.ingress.tls.secretName | default (printf "%s-frontend-tls" (include "resident-cement.fullname" .)) }}
  issuerRef:
    name: {{ .Values.certManager.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.frontend.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
---
# Admin Dashboard Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "resident-cement.admin-dashboard.fullname" . }}-tls
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.adminDashboard.ingress.tls.secretName | default (printf "%s-admin-tls" (include "resident-cement.fullname" .)) }}
  issuerRef:
    name: {{ .Values.certManager.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.adminDashboard.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
{{- end }}
