{{/*
ResidentCement Secrets Template
NOTE: In production, use external secret management (Vault, AWS Secrets Manager, etc.)
       and reference them via existingSecret configurations.
*/}}
{{- if and (not .Values.vault.enabled) .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resident-cement.fullname" . }}-secrets
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ include "resident-cement.secrets.jwtSecret" . | b64enc | quote }}
  api-key: {{ include "resident-cement.secrets.apiKey" . | b64enc | quote }}
  db-password: {{ include "resident-cement.secrets.dbPassword" . | b64enc | quote }}
  mongo-password: {{ include "resident-cement.secrets.mongoPassword" . | b64enc | quote }}
  redis-password: {{ include "resident-cement.secrets.redisPassword" . | b64enc | quote }}
  {{- if .Values.secrets.paystackSecretKey }}
  paystack-secret-key: {{ .Values.secrets.paystackSecretKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.keycloakPassword }}
  keycloak-password: {{ .Values.secrets.keycloakPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.minioPassword }}
  minio-password: {{ .Values.secrets.minioPassword | b64enc | quote }}
  {{- end }}
{{- end }}
