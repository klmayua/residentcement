{{/*
ResidentCement Pod Security Standards
Uses the modern Pod Security Standards (PSS) replacing deprecated PSPs
Applied via namespace labels
*/}}
{{- if .Values.podSecurityStandards.enabled }}
---
# Pod Security Standard - Restricted (applied to application namespace)
# Most restrictive, follows security best practices
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
    # Apply restricted Pod Security Standard
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# Security Context Constraints for Deployments
# These are applied via the securityContext in each deployment
# This ConfigMap documents the security requirements
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "resident-cement.fullname" . }}-security-policy
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
data:
  policy.yaml: |
    # Pod Security Standard - Restricted Profile
    # This is enforced at the namespace level via labels

    spec:
      securityContext:
        # Run as non-root user
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - securityContext:
            # Prevent privilege escalation
            allowPrivilegeEscalation: false
            # Read-only root filesystem
            readOnlyRootFilesystem: true
            # Drop all capabilities
            capabilities:
              drop:
                - ALL
            # Run as non-root
            runAsNonRoot: true
            runAsUser: 1001
            # Seccomp profile
            seccompProfile:
              type: RuntimeDefault

      # Volumes allowed
      volumes:
        - configMap
        - downwardAPI
        - emptyDir
        - projected
        - secret
        - persistentVolumeClaim
---
# RBAC for Pod Security Admission
# Allow service accounts to use the restricted security context
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "resident-cement.fullname" . }}-security-context
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "resident-cement.fullname" . }}-security-context
  labels:
    {{- include "resident-cement.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "resident-cement.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "resident-cement.fullname" . }}-security-context
  apiGroup: rbac.authorization.k8s.io
{{- end }}
