# ResidentCement Helm Chart - Default Values
# This is a YAML-formatted file. Declare variables to be passed into your templates.

# Global settings
global:
  # Environment: development, staging, production
  environment: production

  # Image registry settings
  imageRegistry: ""
  imagePullSecrets: []

  # Storage class for PVCs
  storageClass: ""

  # Node selector for all pods
  nodeSelector: {}

  # Tolerations for all pods
  tolerations: []

  # Affinity rules for all pods
  affinity: {}

# PostgreSQL Configuration (Bitnami Chart)
postgresql:
  enabled: true
  auth:
    username: resident_cement
    password: ""
    database: resident_cement
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 50Gi
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 1000m

# Redis Configuration (Bitnami Chart)
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: ""
  master:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

# Kafka Configuration (Bitnami Chart)
kafka:
  enabled: true
  replicaCount: 3
  auth:
    enabled: false
  persistence:
    enabled: true
    size: 30Gi
  zookeeper:
    enabled: true
    persistence:
      enabled: true
      size: 10Gi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m

# MongoDB Configuration (Bitnami Chart)
mongodb:
  enabled: true
  auth:
    enabled: true
    rootUser: resident_cement
    rootPassword: ""
    existingSecret: ""
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m

# MinIO Configuration (Bitnami Chart)
minio:
  enabled: true
  auth:
    rootUser: minio_admin
    rootPassword: ""
    existingSecret: ""
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  consoleIngress:
    enabled: false

# =============================================================================
# Microservices Configuration
# =============================================================================

# Shared configuration for all microservices
microservices:
  image:
    registry: ""
    repositoryPrefix: "resident-cement"
    tag: "latest"
    pullPolicy: IfNotPresent

  # Service account
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

  # Security context for containers
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001

# API Gateway
gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: gateway
    tag: ""
  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/rate-limit: "100"
    hosts:
      - host: api.residentcement.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: resident-cement-tls
        hosts:
          - api.residentcement.com
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    NODE_ENV: production
    PORT: "3001"
    LOG_LEVEL: info
    CORS_ORIGIN: "https://residentcement.com,https://admin.residentcement.com"

# Frontend: Distributor Portal
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: distributor-portal
    tag: ""
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: residentcement.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: resident-cement-tls
        hosts:
          - residentcement.com
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Frontend: Admin Dashboard
adminDashboard:
  enabled: true
  replicaCount: 2
  image:
    repository: admin-dashboard
    tag: ""
  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: admin.residentcement.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: resident-cement-tls
        hosts:
          - admin.residentcement.com
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

