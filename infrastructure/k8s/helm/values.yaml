# =============================================================================
# Secrets Configuration
# =============================================================================

secrets:
  # Database passwords
  dbPassword: ""
  mongoPassword: ""
  redisPassword: ""

  # Application secrets
  jwtSecret: ""
  apiKey: ""

  # Infrastructure passwords
  keycloakPassword: ""
  minioPassword: ""

  # Payment secrets
  paystackSecretKey: ""

# =============================================================================
# Monitoring Configuration
# =============================================================================

monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  grafana:
    enabled: true
    dashboards:
      enabled: true

# =============================================================================
# Network Policies
# =============================================================================

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: resident-cement
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: resident-cement

# =============================================================================
# cert-manager Configuration
# =============================================================================

certManager:
  enabled: false  # Set to true when cert-manager is installed
  clusterIssuer: letsencrypt-prod  # or letsencrypt-staging, selfsigned-issuer

# =============================================================================
# Pod Security Standards
# =============================================================================

podSecurityStandards:
  enabled: true

# =============================================================================
# Pod Disruption Budgets
# =============================================================================

pdb:
  enabled: true
  minAvailable: 1

# =============================================================================
# Vault Integration (External Secrets)
# =============================================================================

vault:
  enabled: false  # Set to true when Vault is installed
  address: http://vault.vault.svc.cluster.local:8200
  secretStoreKind: ClusterSecretStore
  secretStoreName: vault-backend
  refreshInterval: 1h  # How often to sync secrets from Vault

# =============================================================================
# Distributed Tracing (Jaeger)
# =============================================================================

tracing:
  enabled: false  # Set to true when Jaeger is installed
  jaeger:
    endpoint: http://otel-collector.observability.svc.cluster.local:4317
    serviceName: "{{ .Chart.Name }}"
  sampling:
    rate: 0.1  # Sample 10% of traces
