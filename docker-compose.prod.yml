# ResidentCement - Docker Compose (Production)
# Usage: docker compose -f docker-compose.prod.yml up -d
# Prerequisites: Copy .env.example to .env and fill in real values

services:
  # === REVERSE PROXY ===
  nginx:
    image: nginx:1.25-alpine
    container_name: rc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      admin-dashboard:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped

  # === FRONTEND: Distributor Portal ===
  frontend:
    build:
      context: .
      dockerfile: frontend/apps/distributor-portal/Dockerfile
    container_name: rc-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://gateway:3001
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # === FRONTEND: Admin Dashboard ===
  admin-dashboard:
    build:
      context: .
      dockerfile: frontend/apps/admin-dashboard/Dockerfile
    container_name: rc-admin-dashboard
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://gateway:3001
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # === API GATEWAY ===
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rc-gateway
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      API_KEY: ${API_KEY}
      CORS_ORIGIN: http://localhost,http://frontend:3000,http://admin-dashboard:3001
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      PRICING_SERVICE_URL: http://pricing-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      PRODUCT_SERVICE_URL: http://product-service:3006
      ORDER_SERVICE_URL: http://order-service:3007
      PLANT_MES_SERVICE_URL: http://plant-mes-service:3008
      QUALITY_SERVICE_URL: http://quality-service:3009
      LOGISTICS_SERVICE_URL: http://logistics-service:3010
      ACCOUNTING_SERVICE_URL: http://accounting-service:3011
      REPORTING_SERVICE_URL: http://reporting-service:3012
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # === DATABASE MIGRATION (init container) ===
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rc-db-migrate
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed || true"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: "no"

  # === MICROSERVICES ===
  customer-service:
    build:
      context: .
      dockerfile: backend/services/customer-service/Dockerfile
    container_name: rc-customer-svc
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  inventory-service:
    build:
      context: .
      dockerfile: backend/services/inventory-service/Dockerfile
    container_name: rc-inventory-svc
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  pricing-service:
    build:
      context: .
      dockerfile: backend/services/pricing-service/Dockerfile
    container_name: rc-pricing-svc
    environment:
      NODE_ENV: production
      PORT: "3004"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  payment-service:
    build:
      context: .
      dockerfile: backend/services/payment-service/Dockerfile
    container_name: rc-payment-svc
    environment:
      NODE_ENV: production
      PORT: "3005"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  product-service:
    build:
      context: .
      dockerfile: backend/services/product-service/Dockerfile
    container_name: rc-product-svc
    environment:
      NODE_ENV: production
      PORT: "3006"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3006/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  order-service:
    build:
      context: .
      dockerfile: backend/services/order-service/Dockerfile
    container_name: rc-order-svc
    environment:
      NODE_ENV: production
      PORT: "3007"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3007/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  plant-mes-service:
    build:
      context: .
      dockerfile: backend/services/plant-mes-service/Dockerfile
    container_name: rc-plant-mes-svc
    environment:
      NODE_ENV: production
      PORT: "3008"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3008/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  quality-service:
    build:
      context: .
      dockerfile: backend/services/quality-service/Dockerfile
    container_name: rc-quality-svc
    environment:
      NODE_ENV: production
      PORT: "3009"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3009/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  logistics-service:
    build:
      context: .
      dockerfile: backend/services/logistics-service/Dockerfile
    container_name: rc-logistics-svc
    environment:
      NODE_ENV: production
      PORT: "3010"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  events-service:
    build:
      context: .
      dockerfile: backend/services/events/Dockerfile
    container_name: rc-events-svc
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: events-service-group
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped

  accounting-service:
    build:
      context: .
      dockerfile: backend/services/accounting-service/Dockerfile
    container_name: rc-accounting-svc
    environment:
      NODE_ENV: production
      PORT: "3011"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3011/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  reporting-service:
    build:
      context: .
      dockerfile: backend/services/reporting-service/Dockerfile
    container_name: rc-reporting-svc
    environment:
      NODE_ENV: production
      PORT: "3012"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3012/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ussd-service:
    build:
      context: .
      dockerfile: backend/services/ussd-service/Dockerfile
    container_name: rc-ussd-svc
    ports:
      - "4008:4008"
    environment:
      NODE_ENV: production
      PORT: "4008"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SHORTCODE: ${AT_SHORTCODE:-*384#}
      AT_SENDER_ID: ${AT_SENDER_ID:-ResidentCement}
      AT_SMS_ENABLED: ${AT_SMS_ENABLED:-false}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4008/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # === INFRASTRUCTURE ===
  postgres:
    image: postgres:16-alpine
    container_name: rc-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: rc-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongodb_data:/data/db
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rc-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rc-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  minio:
    image: minio/minio:latest
    container_name: rc-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  resident-cement-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:
  minio_data:
