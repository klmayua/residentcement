# ResidentCement - Docker Compose (Production)
# Usage: docker compose -f docker-compose.prod.yml up -d
# Prerequisites: Copy .env.docker to .env and fill in real values

services:
  # === REVERSE PROXY ===
  nginx:
    image: nginx:1.25-alpine
    container_name: rc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped

  # === FRONTEND ===
  frontend:
    build:
      context: .
      dockerfile: frontend/apps/distributor-portal/Dockerfile
    container_name: rc-frontend
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # === API GATEWAY ===
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rc-gateway
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost,http://frontend:3000
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3005
      PRICING_SERVICE_URL: http://pricing-service:3004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # === DATABASE MIGRATION (init container) ===
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rc-db-migrate
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed || true"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - resident-cement-network
    restart: "no"

  # === MICROSERVICES ===
  customer-service:
    build:
      context: .
      dockerfile: backend/services/customer-service/Dockerfile.prod
    container_name: rc-customer-svc
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  order-service:
    build:
      context: .
      dockerfile: backend/services/order-service/Dockerfile.prod
    container_name: rc-order-svc
    environment:
      NODE_ENV: production
      PORT: "3007"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3007/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  product-service:
    build:
      context: .
      dockerfile: backend/services/product-service/Dockerfile.prod
    container_name: rc-product-svc
    environment:
      NODE_ENV: production
      PORT: "3006"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3006/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  inventory-service:
    build:
      context: .
      dockerfile: backend/services/inventory-service/Dockerfile.prod
    container_name: rc-inventory-svc
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  payment-service:
    build:
      context: .
      dockerfile: backend/services/payment-service/Dockerfile.prod
    container_name: rc-payment-svc
    environment:
      NODE_ENV: production
      PORT: "3005"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  pricing-service:
    build:
      context: .
      dockerfile: backend/services/pricing-service/Dockerfile.prod
    container_name: rc-pricing-svc
    environment:
      NODE_ENV: production
      PORT: "3004"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # === INFRASTRUCTURE ===
  postgres:
    image: postgres:16-alpine
    container_name: rc-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: rc-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongodb_data:/data/db
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rc-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rc-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - resident-cement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  minio:
    image: minio/minio:latest
    container_name: rc-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - resident-cement-network
    restart: unless-stopped

networks:
  resident-cement-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:
  minio_data:
