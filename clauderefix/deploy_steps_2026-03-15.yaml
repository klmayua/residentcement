block_b_nginx:

  - id: B1
    title: "Create nginx conf.d directory"
    severity: CRITICAL
    action: |
      Create directory:
        infrastructure/docker/nginx/conf.d/
    note: The parent directory infrastructure/docker/nginx/ already exists (has nginx.conf).

  - id: B2
    title: "Create nginx default.conf with routing rules"
    severity: CRITICAL
    file: infrastructure/docker/nginx/conf.d/default.conf
    action: |
      Create NEW file with this exact content:

      server {
          listen 80;
          server_name _;

          # API Gateway — all /api/ requests
          location /api/ {
              proxy_pass http://gateway:3001;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 60s;
              proxy_send_timeout 60s;
          }

          # Swagger docs
          location /api-docs {
              proxy_pass http://gateway:3001;
              proxy_set_header Host $host;
          }

          # Health check passthrough
          location /health {
              proxy_pass http://gateway:3001;
          }

          # WebSocket support
          location /ws {
              proxy_pass http://gateway:3001;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
          }

          # Frontend (Next.js) — everything else
          location / {
              proxy_pass http://frontend:3000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
          }
      }
    reason: |
      docker-compose.prod.yml mounts this directory into nginx but it's empty.
      Without routing rules, nginx returns default page or 404.

