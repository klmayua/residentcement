# =============================================================================
# ARCHITECTURE NOTE — Gateway vs Microservices
# =============================================================================

architecture_note: |
  IMPORTANT: The gateway handles customer, order, and product routes DIRECTLY
  via Prisma (not proxying to microservices). The separate customer-service,
  order-service, and product-service containers exist as independent REST APIs
  but the gateway does NOT route to them.

  Only these microservices are actually called by the gateway:
    - inventory-service (via INVENTORY_SERVICE_URL)
    - payment-service (via PAYMENT_SERVICE_URL)
    - pricing-service (via PRICING_SERVICE_URL)

  The customer, order, and product microservice containers will start and listen
  on their ports, but receive no traffic from the gateway. This is not a bug — it's
  an architectural pattern where the gateway owns some domains directly and delegates
  others to microservices. In a future iteration, you may want to migrate all direct
  Prisma routes to their respective microservices.

