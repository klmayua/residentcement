  After applying blocks A-G, the key changes to docker-compose.prod.yml are:

  1. gateway.environment gains 3 new lines:
       INVENTORY_SERVICE_URL: http://inventory-service:3003
       PAYMENT_SERVICE_URL: http://payment-service:3005
       PRICING_SERVICE_URL: http://pricing-service:3004

  2. ALL 6 microservices change from:
       build:
         context: backend/services/<name>
     To:
       build:
         context: .
         dockerfile: backend/services/<name>/Dockerfile.prod

  That's it. Two types of changes. Everything else was already correct.

