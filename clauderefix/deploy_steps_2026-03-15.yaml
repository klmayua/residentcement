block_a_build_contexts:

  - id: A1
    title: "Change customer-service build to use root context + Dockerfile.prod"
    severity: CRITICAL
    file: docker-compose.prod.yml
    action: |
      Find the customer-service build block:
        customer-service:
          build:
            context: backend/services/customer-service
      Replace with:
        customer-service:
          build:
            context: .
            dockerfile: backend/services/customer-service/Dockerfile.prod
    reason: |
      Dockerfile.prod copies from backend/shared/kernel which only exists
      relative to project root, not relative to the service directory.

  - id: A2
    title: "Change order-service build to use root context + Dockerfile.prod"
    severity: CRITICAL
    file: docker-compose.prod.yml
    action: |
      Find the order-service build block:
