name: CI - Continuous Integration

on:
  push:
    branches: [main, master, develop, 'build-*']
  pull_request:
    branches: [main, master, develop]

jobs:
  # ============================================
  # LINT JOB
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint
        continue-on-error: true

  # ============================================
  # BACKEND GATEWAY BUILD & TEST
  # ============================================
  backend-gateway:
    name: Backend Gateway
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resident_cement
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: resident_cement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/gateway/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend/gateway
        run: npm ci
      
      - name: Generate Prisma client
        working-directory: ./backend/gateway
        run: npx prisma generate
      
      - name: Run database migrations
        working-directory: ./backend/gateway
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://resident_cement:test_password@localhost:5432/resident_cement_test
      
      - name: Build TypeScript
        working-directory: ./backend/gateway
        run: npm run build
      
      - name: Run tests
        working-directory: ./backend/gateway
        run: npm test || echo "No tests configured yet"
        continue-on-error: true

  # ============================================
  # BACKEND SERVICES BUILD
  # ============================================
  backend-services:
    name: Backend Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [customer-service, inventory-service, pricing-service, payment-service, product-service, order-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/services/${{ matrix.service }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend/services/${{ matrix.service }}
        run: npm ci
        continue-on-error: true
      
      - name: Build TypeScript
        working-directory: ./backend/services/${{ matrix.service }}
        run: npm run build
        continue-on-error: true

  # ============================================
  # FRONTEND BUILD
  # ============================================
  frontend:
    name: Frontend Applications
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [distributor-portal, admin-dashboard]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/apps/${{ matrix.app }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: npm ci
        continue-on-error: true
      
      - name: Build Next.js
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: npm run build
        continue-on-error: true

  # ============================================
  # E2E TESTS
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json
      
      - name: Install dependencies
        working-directory: ./tests/e2e
        run: npm ci
        continue-on-error: true
      
      - name: Install Playwright browsers
        working-directory: ./tests/e2e
        run: npx playwright install --with-deps
        continue-on-error: true
      
      - name: Run E2E tests
        working-directory: ./tests/e2e
        run: npm test || echo "Tests require running services"
        continue-on-error: true

  # ============================================
  # DOCKER COMPOSE VALIDATION
  # ============================================
  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate docker-compose
        working-directory: ./infrastructure/docker
        run: docker-compose config
        continue-on-error: true
