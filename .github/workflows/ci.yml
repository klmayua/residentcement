name: CI - Continuous Integration

on:
  push:
    branches: [main, master, develop, 'build-*']
  pull_request:
    branches: [main, master, develop]

jobs:
  # ============================================
  # LINT JOB
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint
        continue-on-error: true

  # ============================================
  # BACKEND GATEWAY BUILD & TEST
  # ============================================
  backend-gateway:
    name: Backend Gateway
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resident_cement
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: resident_cement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/gateway/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend/gateway
        run: npm ci
      
      - name: Generate Prisma client
        working-directory: ./backend/gateway
        run: npx prisma generate
      
      - name: Run database migrations
        working-directory: ./backend/gateway
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://resident_cement:test_password@localhost:5432/resident_cement_test
      
      - name: Build TypeScript
        working-directory: ./backend/gateway
        run: npm run build
      
      - name: Run tests
        working-directory: ./backend/gateway
        run: npm test || echo "No tests configured yet"
        continue-on-error: true

  # ============================================
  # SHARED PACKAGES BUILD
  # ============================================
  shared-packages:
    name: Build Shared Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Kernel Package
        working-directory: ./backend/shared/kernel
        run: |
          npm ci
          npm run build

      - name: Build Kafka Client Package
        working-directory: ./backend/shared/kafka-client
        run: |
          npm ci
          npm run build

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dist
          path: backend/shared/kernel/dist
          retention-days: 1

      - name: Upload Kafka Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafka-client-dist
          path: backend/shared/kafka-client/dist
          retention-days: 1

  # ============================================
  # BACKEND SERVICES BUILD
  # ============================================
  backend-services:
    name: Backend Services
    runs-on: ubuntu-latest
    needs: shared-packages
    strategy:
      matrix:
        service: [customer-service, inventory-service, pricing-service, payment-service, product-service, order-service, plant-mes-service, quality-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download Shared Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore Shared Packages
        run: |
          mkdir -p backend/shared/kernel/dist backend/shared/kafka-client/dist
          cp -r artifacts/kernel-dist/* backend/shared/kernel/dist/ || true
          cp -r artifacts/kafka-client-dist/* backend/shared/kafka-client/dist/ || true

      - name: Install Shared Dependencies
        run: |
          cd backend/shared/kernel && npm ci
          cd ../kafka-client && npm ci

      - name: Install Service Dependencies
        working-directory: ./backend/services/${{ matrix.service }}
        run: npm ci

      - name: Build TypeScript
        working-directory: ./backend/services/${{ matrix.service }}
        run: npm run build

  # ============================================
  # FRONTEND BUILD
  # ============================================
  frontend:
    name: Frontend Applications
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [distributor-portal, admin-dashboard]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: npm ci

      - name: Build Next.js
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: 1

  # ============================================
  # E2E TESTS
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json
      
      - name: Install dependencies
        working-directory: ./tests/e2e
        run: npm ci
        continue-on-error: true
      
      - name: Install Playwright browsers
        working-directory: ./tests/e2e
        run: npx playwright install --with-deps
        continue-on-error: true
      
      - name: Run E2E tests
        working-directory: ./tests/e2e
        run: npm test || echo "Tests require running services"
        continue-on-error: true

  # ============================================
  # DOCKER COMPOSE VALIDATION
  # ============================================
  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose
        working-directory: ./infrastructure/docker
        run: docker-compose config

  # ============================================
  # CI SUMMARY
  # ============================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, backend-gateway, shared-packages, backend-services, frontend, docker-validation]
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "=========================================="
          echo "CI/CD Pipeline Summary"
          echo "=========================================="
          echo "Lint:                  ${{ needs.lint.result }}"
          echo "Backend Gateway:       ${{ needs.backend-gateway.result }}"
          echo "Shared Packages:       ${{ needs.shared-packages.result }}"
          echo "Backend Services:      ${{ needs.backend-services.result }}"
          echo "Frontend:              ${{ needs.frontend.result }}"
          echo "Docker Validation:     ${{ needs.docker-validation.result }}"
          echo "=========================================="

      - name: Check All Passed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "One or more jobs failed!"
          exit 1
